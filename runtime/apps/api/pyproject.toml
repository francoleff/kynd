[project]
name = "kynd-api"
version = "0.1.0"
description = "Kynd OS SaaS API — the product layer around the Kynd Runtime."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "playwright>=1.44",
]

[tool.setuptools]
packages = ["kynd_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
