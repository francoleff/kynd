name: CI

# A pull request is not safe because the author says it works.
# These gates are the objective check.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: no job needs to write to the repo, create
# releases, or touch packages. A pull_request (not pull_request_target)
# trigger from a fork gets a read-only, secret-less GITHUB_TOKEN automatically
# — this workflow never opts into pull_request_target and never checks out
# untrusted code with elevated permissions or exposes repo secrets to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml claims support for (requires-python
        # ">=3.10", classifiers list 3.10/3.11/3.12). None had ever actually
        # been run on a CI runner before this pipeline — see the D-11
        # verification report for the first real run's results per version.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + integration tests (full suite)
        run: pytest -q

      - name: "Persistence tests: SQLite WAL, BEGIN IMMEDIATE, migrations, restart"
        run: pytest tests/test_persistence_d1.py -v

      - name: Multi-process quota sharing (real threads, in-process)
        run: pytest tests/test_persistence_d1.py::TestMultiProcessQuotaSharing -v

      - name: Concurrent idempotency and approval races
        run: |
          pytest tests/test_persistence_d1.py::TestConcurrentDuplicateRequests -v
          pytest "tests/test_persistence_d1.py::TestApprovalVerification::test_concurrent_consumption_of_one_time_approval_only_one_wins" -v

      - name: Flake check - repeat the full suite 3x consecutively
        # A single green run proves nothing about concurrency-heavy code.
        # This mirrors the 3-consecutive-run check done locally before D-1
        # was reported done; CI must reproduce that, not just take it on
        # faith from a prior local report.
        run: |
          for i in 1 2 3; do
            echo "=== run $i ==="
            pytest -q
          done

      - name: Real multi-process quota test (separate OS processes, not threads)
        # Threads share a process and its already-open file descriptors.
        # Real process starts race the SQLite file's first creation and its
        # WAL-mode conversion in ways no thread-based test can reproduce —
        # this exact scenario is what surfaced two real bugs in persistence.py
        # during development (see docs/engineering/D1_IMPLEMENTATION.md).
        # This step proves the fix holds outside the developer's own machine.
        run: |
          set -e
          rm -f /tmp/kynd_ci_mp_test.db*
          cat > /tmp/kynd_ci_mp_worker.py <<'PYEOF'
          import sys
          from kynd_runtime import Constitution, Executor, KyndExecutionError, SqliteStore, ToolRegistry

          db, n_attempts, worker_id = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          raw = {"capabilities": [{"name": "charge_card", "max_amount": 1000, "max_calls_per_day": 5}]}
          reg = ToolRegistry()
          reg.register("charge_card", lambda p: "CHARGED")
          store = SqliteStore(db)
          ex = Executor(Constitution(raw), reg, store=store)

          allowed = 0
          for _ in range(n_attempts):
              try:
                  ex.execute("charge_card", {"amount": 1})
                  allowed += 1
              except KyndExecutionError:
                  pass
          print(f"{worker_id}:{allowed}")
          PYEOF
          for i in 1 2 3 4 5 6 7 8; do
            python /tmp/kynd_ci_mp_worker.py /tmp/kynd_ci_mp_test.db 10 "worker$i" &
          done
          wait
          echo "--- verifying total quota consumed across all 8 processes ---"
          python - <<'PYEOF'
          from kynd_runtime import SqliteStore
          from datetime import date
          store = SqliteStore("/tmp/kynd_ci_mp_test.db")
          count = store.calls_today(date.today().isoformat(), "charge_card")
          print(f"total calls consumed: {count} (cap was 5)")
          assert count == 5, f"FAIL: expected exactly 5, got {count} - quota bypassed across processes"
          print("PASS: quota held exactly at cap across 8 real OS processes")
          PYEOF

      - name: Coverage (governance core must stay covered)
        if: matrix.python-version == '3.11'
        run: |
          pytest --cov=kynd_runtime --cov-report=term-missing \
                 --cov-fail-under=85

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and type-checking tooling
        # mypy needs the real package importable (not just installed
        # separately) to resolve internal imports correctly, and the pyyaml
        # stubs to check constitution.py's yaml.safe_load() boundary.
        run: pip install -e ".[dev]"

      - name: mypy (src/ — see [tool.mypy] in pyproject.toml for config)
        run: mypy

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install ruff

      - name: Ruff check
        run: ruff check src tests

      # `ruff format --check` is intentionally NOT run as a gate yet. This
      # repo predates a `[tool.ruff]` config; introducing one now against
      # 18 already-reviewed files would force a purely cosmetic mass reformat
      # with zero behavior change, which is out of scope for D-11 ("do not
      # change application behavior unless CI exposes a genuine defect" -
      # a formatting preference is not a defect). `ruff check` (lint) already
      # catches real bugs: unused imports/vars, bare excepts, security
      # anti-patterns. Formatting can be adopted as its own deliberate,
      # reviewed pass later - tracked as D-15 in TECHNICAL_DEBT.md.

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (so its actual dependency versions are audited)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Install security tooling
        run: pip install pip-audit bandit

      - name: Dependency audit
        # --skip-editable: kynd-runtime itself is installed in editable mode
        # (pip install -e .) and is not published to PyPI, so pip-audit
        # cannot look it up there - that is an expected "can't audit this
        # one" skip, not a vulnerability, and pip-audit reports it as a
        # distinct skip reason rather than a failure. Its real dependency
        # (pyyaml) and the installed pip/setuptools ARE audited.
        #
        # Deliberately NOT --strict: --strict fails the whole run on ANY
        # dependency-collection issue, including an intentional
        # --skip-editable skip -- confirmed by running this exact command
        # locally and on a real CI runner, both exit 1 with "distribution
        # marked as editable" purely because of --strict, with zero actual
        # vulnerabilities found. Exit code without --strict is 0 only when
        # pip-audit finds zero real vulnerabilities in the dependencies it
        # COULD audit, which is the gate we actually want.
        run: pip-audit --desc --skip-editable

      - name: Static security scan
        # -ll: report Low-severity-and-above findings. src/verification.py's
        # one legitimate shell=True usage is an explicit, documented,
        # caller-opt-in (default False) feature, not reachable from any
        # untrusted input in this codebase - annotated with a nosec comment
        # at the call site explaining why. Bandit finds zero unreviewed issues.
        run: bandit -r src -ll

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install the built wheel into a clean venv and smoke-test it
        # Proves the package is actually installable and importable outside
        # the repo's own editable-mode dev environment - a real release-gate
        # question, not just "does `pip install -e .` work."
        run: |
          python -m venv /tmp/kynd_wheel_test_venv
          /tmp/kynd_wheel_test_venv/bin/pip install dist/*.whl
          /tmp/kynd_wheel_test_venv/bin/python -c "
          import kynd_runtime
          assert kynd_runtime.Executor
          assert kynd_runtime.SqliteStore
          print('wheel import OK:', kynd_runtime.__file__)
          "

      - name: Verify py.typed ships in the wheel (PEP 561)
        # Without this marker, a downstream consumer's mypy/pyright treats
        # kynd-runtime as an untyped dependency and ignores all of its
        # inline annotations -- silently defeating the point of D-6 for
        # anyone importing this package rather than developing inside it.
        run: |
          unzip -l dist/*.whl | grep -q "kynd_runtime/py.typed" && \
            echo "PASS: py.typed present in wheel" || \
            (echo "FAIL: py.typed missing from built wheel" && exit 1)

  examples:
    # Smoke test: every shipped example must actually run, not just exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python examples/e2e_demo.py
      - run: python examples/send_email.py
      - run: python examples/hardening_demo.py
      - run: python examples/durable_governance_demo.py
