name: kynd-runtime
mission: |
  Kynd is a governance layer on top of Hermes Agent. It enforces
  constitution rules on every action, caps spending and call rates,
  validates targets against allowlists, and audits everything.

hard_rules:
  - name: no-destructive-actions
    type: block_action_type
    action_types: [delete, destroy, drop, truncate, purge]

  - name: require-approval-for-money
    type: require_param
    param: approval_id
    action_types: [charge_card, send_payment, transfer_funds]

  - name: no-personal-accounts
    type: block_param_value
    param: destination
    blocked_values: [personal_account, personal_wallet, personal_bank]

  - name: no-unknown-capabilities
    type: block_capability
    capabilities: [admin_access, root_access, superuser]

capabilities:
  - name: send_email
    max_amount: 0
    max_calls_per_day: 100
    allowed_targets:
      - team@kynd.io
      - newsletter@kynd.io
      - support@kynd.io

  - name: charge_card
    max_amount: 500.00
    max_calls_per_day: 10

  - name: send_slack_message
    max_amount: 0
    max_calls_per_day: 200
    allowed_targets:
      - "#general"
      - "#build-with-me"
      - "#kynd-updates"

  - name: post_to_discord
    max_amount: 0
    max_calls_per_day: 50
    allowed_targets:
      - "#ai-news"
      - "#kynd-free-resources"

  - name: run_terminal_command
    max_amount: 0
    max_calls_per_day: 500

  - name: make_http_request
    max_amount: 0
    max_calls_per_day: 1000
