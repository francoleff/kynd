[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kynd-runtime"
version = "0.1.0"
description = "The operating system for autonomous agents — governance, memory, orchestration."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# py.typed (PEP 561 marker) must ship in the built wheel or downstream
# consumers' type checkers will treat this package as untyped even though
# it has full inline annotations. Without this, setuptools would silently
# drop the marker file since it has no .py extension.
kynd_runtime = ["py.typed"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"

# Baseline, not maximum strictness (D-6 mission Phase 8: "start with a
# useful baseline... do not create hundreds of noisy warnings"). This set
# catches the categories the mission explicitly asks for — incompatible
# assignments, invalid returns, missing attributes, incorrect arguments,
# Optional misuse, unreachable branches, incorrect overrides, untyped
# decorators (relevant here: the optional langfuse integration) — without
# turning on every --strict flag, several of which (disallow-any-expr,
# disallow-any-decorated, warn-unused-configs on every file) would produce
# noise disproportionate to this codebase's size and risk.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

# `warn_unreachable` is deliberately NOT enabled. mypy's static model does
# not understand `numbers.Real` as covering `float` after an
# `isinstance(x, numbers.Real)` narrow followed by `x = float(x)` — a
# well-known mypy/typeshed limitation with the `numbers` ABC's virtual
# subclassing, confirmed false-positive here: `isinstance(3.5,
# numbers.Real)` is genuinely `True` at runtime. This exact pattern is used
# throughout the amount-validation code in broker.py, governance_gate.py,
# and persistence.py — the governance-critical "is this a real, finite,
# non-negative number" checks. Enabling warn_unreachable would force either
# 9 scattered `type: ignore[unreachable]` comments on safety-critical
# validation code, or a rewrite of working, tested validation logic to
# appease the checker rather than to fix anything real — exactly what the
# mission says not to do ("do not weaken types just to make the checker
# pass"). Revisit if a future mypy release models `numbers.Real` correctly.

# `tests/` is intentionally excluded from `files` above. Pytest test
# functions are conventionally unannotated (fixtures, parametrize, `self`)
# and forcing full typing there would be exactly the "obsessively typing
# trivial" the mission says to avoid, for a directory that is not a public
# interface, a governance path, or an external boundary. `src/` — the
# entire mission's priority list — is fully covered.

[[tool.mypy.overrides]]
# langfuse ships no type stubs and is an optional runtime dependency (see
# observability.py's try/except ImportError). Isolating the ignore to this
# one module, rather than a blanket `ignore_missing_imports = true` at the
# top level, means every OTHER external import in this codebase (pyyaml,
# stdlib) stays fully checked — a new untyped dependency added elsewhere
# would still be caught, not silently swallowed by a global exclusion.
module = "langfuse"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow: this is a small, already-reviewed governance library.
# Enabling ruff's full default+preview rule set retroactively would produce a
# repo-wide reformat with no behavior change and a large, low-signal diff —
# exactly what the D-11 mission says not to do ("do not change application
# behavior unless CI exposes a genuine defect"). These are the rule families
# that catch real bugs (unused imports/vars, bare excepts, shadowing) without
# forcing a wholesale style rewrite.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/vars, undefined names — real bugs)
    "B",    # flake8-bugbear (common footguns)
    "S",    # flake8-bandit (security; bandit itself also runs separately)
]
ignore = [
    "S101",  # assert used — normal and required in pytest
]

[tool.ruff.lint.per-file-ignores]
# Test files legitimately use assert, broad excepts for adversarial probing,
# and deliberately construct the exact "bad" values (0.0.0.0 binds, chmod
# permission tests, http requests to a local test server) that these security
# rules exist to catch elsewhere — that's what makes them regression tests.
"tests/*" = [
    "S101",  # assert used — normal and required in pytest
    "S103",  # permissive os.chmod — deliberately used to simulate a locked-down directory
    "S104",  # 0.0.0.0 bind — the literal value under test (must be REJECTED, see test name)
    "S105", "S106",  # hardcoded "password" false positives on test tokens
    "S110",  # try/except/pass — deliberate in adversarial probes
    "S310",  # urlopen — talks to a 127.0.0.1 test server this same test starts
    "B007",  # unused loop var — intentional in repeat-N-times helpers
    "B017",  # broad `pytest.raises(Exception)` — adversarial tests want any failure caught
    "E501",  # long literal test fixtures (params dicts, SQL injection strings) read
             # worse wrapped than unwrapped; src/ has no E501 findings at all
]
